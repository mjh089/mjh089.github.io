<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden — Michael J. Hofauer</title>
<meta name="robots" content="noindex">
<style>
  html{ scrollbar-width:thin; scrollbar-color:#8a8a86 transparent; }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#8a8a86; border-radius:5px; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    padding:8vh clamp(20px,6vw,72px);
    background:#000; color:#F2F1EE;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{
    font-weight:800; letter-spacing:-0.045em; line-height:.85;
    font-size:clamp(4rem,16vw,11rem);
    margin:0 0 clamp(20px,3vh,32px);
  }
  p{
    font-size:clamp(1rem,1.6vw,1.25rem);
    line-height:1.5; color:#A9A296;
    max-width:34ch; margin:0 0 clamp(28px,4vh,44px);
  }
  a{
    color:#F2F1EE; font-size:14px; font-weight:500;
    text-decoration:none;
    background-image:linear-gradient(#F2F1EE,#F2F1EE);
    background-repeat:no-repeat; background-position:0 100%; background-size:100% 1px;
    padding-bottom:2px;
  }
  a:hover{ color:#A9A296; background-image:linear-gradient(#A9A296,#A9A296); }
</style>
</head>
<body>
  <p class="num">404</p>
  <p>Diese Seite gibt es nicht — oder nicht mehr. Vielleicht ist der Link veraltet.</p>
  <a href="/">Zurück zur Startseite ↓</a>
</body>
</html>
