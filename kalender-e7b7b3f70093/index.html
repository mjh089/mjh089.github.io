<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Michael J. Hofauer</title>
<style>
:root{--paper:#FFFFFF;--ink:#0A0A0A;--red:#E1000F;--grey:#6E6E6E;--line:#DBDBDB;
  --font:"Helvetica Neue", Helvetica, Arial, sans-serif}
@media (prefers-color-scheme: dark){:root{--paper:#0A0A0A;--ink:#F2F1EE;--grey:#9C9C97;--line:#2A2A28}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);
  letter-spacing:-.006em;display:flex;align-items:center;-webkit-font-smoothing:antialiased}
.wrap{width:100%;padding:0 clamp(18px,4vw,56px)}
.col{max-width:560px}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:.95;letter-spacing:-.03em;margin:0}
.rule{height:2px;background:var(--red);margin:clamp(20px,3vh,32px) 0}
.meta{font-size:12px;color:var(--grey);line-height:1.5}
form{display:flex;gap:12px;margin-top:clamp(20px,3vh,32px);flex-wrap:wrap}
input{flex:1 1 260px;min-width:0;font-family:var(--font);font-size:15px;letter-spacing:-.006em;
  color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);
  border-radius:0;padding:10px 0;outline:0}
input::placeholder{color:var(--grey)}
input:focus{border-bottom-color:var(--red)}
button{font-family:var(--font);font-size:15px;letter-spacing:-.006em;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;
  padding:10px 0;cursor:pointer;transition:color .2s,border-color .2s}
button:hover{color:var(--red);border-bottom-color:var(--red)}
button[disabled]{color:var(--grey);border-bottom-color:var(--line);cursor:default}
.msg{margin-top:16px;font-size:12px;color:var(--red);min-height:1.4em}
noscript{display:block;margin-top:16px;font-size:12px;color:var(--grey)}
</style>
</head>
